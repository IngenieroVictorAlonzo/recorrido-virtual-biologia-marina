<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recorrido Virtual</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <main class="recorrido">

        <iframe
            src="https://my.matterport.com/show/?m=p3ZYaTnMP9m&qs=1"
            allow="fullscreen; autoplay"
            allowfullscreen>
        </iframe>

        <div class="audio-control">

            <button id="btnAudio">
                🔇
            </button>

            <input
                type="range"
                id="volumen"
                min="0"
                max="1"
                step="0.01"
                value="0.4"
            >

        </div>

    </main>

    <audio id="musica" loop>
        <source src="audio/musica-ambiente.mp3" type="audio/mpeg">
    </audio>

    <script>

        const musica = document.getElementById("musica");
        const btnAudio = document.getElementById("btnAudio");
        const volumen = document.getElementById("volumen");

        musica.volume = 0.4;

        btnAudio.addEventListener("click", () => {

            if (musica.paused) {

                musica.play();

                btnAudio.textContent = "🔊";

            } else {

                musica.pause();

                btnAudio.textContent = "🔇";

            }

        });

        volumen.addEventListener("input", () => {

            musica.volume = volumen.value;

            if (musica.volume === 0) {
                btnAudio.textContent = "🔇";
            } else {
                btnAudio.textContent = "🔊";
            }

        });

    </script>

</body>
</html>
