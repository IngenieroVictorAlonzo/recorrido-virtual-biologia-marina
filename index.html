<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorrido Virtual</title>
    <link rel="stylesheet" href="css/estilos.css"> <!-- Matterport Embed SDK -->

</head>

<body>
    <main class="recorrido">
        <iframe id="showcase-iframe" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen> </iframe>

        <!-- Video de introducción -->
        <div id="intro" class="intro">

            <video id="videoIntro" playsinline autoplay muted>

                <source src="video/animacion sala marina.mp4" media="(max-width: 768px)" type="video/mp4">

                <source src="video/sala marina horizontal.mp4" type="video/mp4">
            </video>


            <!-- Botón para continuar -->
            <button id="btnIniciar" class="btn-iniciar">
                ▶ Iniciar recorrido
            </button>

        </div>


        <div class="audio-control">
            <button id="btnAudio"> 🔇 </button>
            <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.4">
        </div>
    </main>
    <audio id="musica" loop>
        <source src="audio/musica-ambiente.mp3" type="audio/mpeg">
    </audio>

    <script src="js/app.js"></script>
</body>

</html>
