<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorrido Virtual</title>
    <link rel="stylesheet" href="css/estilos.css"> <!-- Matterport Embed SDK -->

</head>

<body>
    <main class="recorrido">
        <iframe id="showcase-iframe" src="https://my.matterport.com/show/?m=p3ZYaTnMP9m&qs=1&play=1&ts=3"
            allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen> </iframe>

        <!-- Pantalla inicial -->
        <div id="inicio" class="inicio">

            <div class="inicio-contenido">

                <h1>Recorrido Virtual</h1>

                <p>
                    Explora el recorrido virtual de Biología Marina
                </p>

                <button id="btnIniciar">
                    ▶ Iniciar recorrido
                </button>

            </div>

        </div>

        <div class="audio-control">
            <button id="btnAudio"> 🔇 </button>
            <input type="range" id="volumen" min="0" max="1" step="0.01" value="0.4">
        </div>
    </main>
    <audio id="musica" loop>
        <source src="audio/musica-ambiente.mp3" type="audio/mpeg">
    </audio>

    <script src="js/app.js"></script>
</body>

</html>
